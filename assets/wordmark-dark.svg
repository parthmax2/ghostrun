<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180">
  <defs>
    <filter id="glow-dark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <text
    x="320" y="115"
    text-anchor="middle"
    font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-style="normal"
    font-weight="800"
    font-size="84"
    letter-spacing="-1"
    fill="#d6d9ff"
    filter="url(#glow-dark)"
  >GhostRun</text>
</svg>
