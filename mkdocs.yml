site_name: ghostrun
site_description: >-
  pytest for LLMs: deterministic HTTP record/replay, local LLM-as-judge
  semantic assertions, and prompt regression diffing for testing GenAI
  applications in Python.
site_url: https://parthmax2.github.io/ghostrun/
repo_url: https://github.com/parthmax2/ghostrun
repo_name: parthmax2/ghostrun
edit_uri: edit/main/doc/

docs_dir: doc
site_dir: _mkdocs_build

theme:
  name: material
  logo: assets/ghost-icon.svg
  favicon: assets/ghost-icon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

markdown_extensions:
  - meta
  - toc:
      permalink: true
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Guide:
      - Recording and replay: guide/recording.md
      - Semantic assertions: guide/assertions.md
      - Prompt regression tracking: guide/regression-tracking.md
      - Configuration: guide/configuration.md
      - API reference: guide/api-reference.md
      - Why not just ask an LLM?: guide/why-not-diy.md
  - Research:
      - Judge-voting benchmark: judge-voting-benchmark.md
      - Comparison with other tools: comparison.md
